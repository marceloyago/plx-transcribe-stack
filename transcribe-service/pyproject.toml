[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plx-transcribe-service"
version = "0.2.0"
description = "PlayLoadX — API Python real de transcrição (faster-whisper), HIL, registry de peers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary PlayLoadX" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "faster-whisper>=1.1.0",
  "PyYAML>=6.0.2",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI injecta File()/Form() nos defaults por desenho.
"src/plx_transcribe/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["plx_transcribe"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "faster_whisper"]
ignore_missing_imports = true

[project.scripts]
plx-transcribe-api = "plx_transcribe.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
