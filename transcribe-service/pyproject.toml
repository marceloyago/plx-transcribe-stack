[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plx-transcribe-service"
version = "0.2.0"
description = "PlayLoadX — API Python real de transcrição (faster-whisper), HIL, registry de peers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary PlayLoadX" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "faster-whisper>=1.1.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "pytest>=8.3.0"]

[project.scripts]
plx-transcribe-api = "plx_transcribe.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
